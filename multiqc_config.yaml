report_comment: >
  This report has been generated by the <a href="https://github.com/ranlib/whole_genome" target="_blank">ranlib/wholegenome</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://github.com/ranlib/wholegenome" target="_blank">documentation</a>.

data_format: "yaml"

max_table_rows: 10000

run_modules:
  - fastqc
  - fastp
  - kraken
  - mosdepth
  - picard
  
module_order:
  - fastqc:
      name: "PREPROCESS: FastQC (raw reads)"
      anchor: "fastqc"
      info: "This section of the report shows FastQC results for the raw reads before adapter trimming."
      path_filters:
        - "*/*.json"
  - fastqc:
      name: "PREPROCESS: FastQC (trimmed reads)"
      anchor: "fastqc_after_clean_up"
      info: "This section of the report shows FastQC results for the raw reads before adapter trimming."
      path_filters:
        - "*/_*.json"
  - fastp:
      name: "PREPROCESS: fastp loose (trimming)"
      anchor: "fastp_loose"   
      info: "This section of the report shows fastp results for reads after adapter and quality trimming."
      path_filters:
        - "*/fastp_loose_*.json"
  - fastp:
      name: "PREPROCESS: fastp (trimming)"
      anchor: "fastp"   
      info: "This section of the report shows fastp results for reads after adapter and quality trimming."
      path_filters:
        - "*/fastp_*.json"
  - kraken:
      name: "PREPROCESS: Kraken 2"
      info: "This section of the report shows Kraken 2 classification results for reads after adapter trimming with fastp."
  - samtools:
      name: "VARIANTS: SAMTools (raw)"
      anchor: "samtools_bowtie2"
      info: "This section of the report shows SAMTools counts/statistics after mapping with Bowtie 2."
      path_filters:
        - "./bowtie2/*"
  - picard:
      name: "BAM QC: picard"
      info: "This section of the report shows WGS QC from picard."
  - mosdepth:
      name: "BAM QC: mosdepth"
      info: "This section of the report shows genome-wide coverage metrics generated by mosdepth."
