report_comment: >
  This report has been generated by the <a href="https://github.com/ranlib/whole_genome" target="_blank">ranlib/whole_genome</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://github.com/ranlib/whole_genome" target="_blank">documentation</a>.

data_format: "yaml"

max_table_rows: 10000

read_count_multiplier: 0.001
read_count_prefix: "K"
read_count_desc: "thousands"

run_modules:
  - custom_content
  - seqkit
  - fastqc
  - fastp
  - kraken
  - samtools
  - mosdepth
  - picard
  - delly
  - snpeff
  
module_order:
  - seqkit:
      name: "PREPROCESS: seqkit (raw reads)"
      anchor: "seqkit_raw"
      info: "SeqKit results for the raw reads."
      path_filters:
        - "*/seqkit_raw/*stats.tsv"

  - fastqc:
      name: "PREPROCESS: FastQC (raw reads)"
      anchor: "fastqc_raw"
      info: "FastQC results for the raw reads before adapter trimming."
      path_filters:
        - "*[!clean]_1_fastqc.zip"
        - "*[!clean]_2_fastqc.zip"

  - fastp:
      name: "PREPROCESS: fastp (loose trimming)"
      anchor: "fastp_loose"   
      info: " results for reads after adapter and quality trimming."
      path_filters:
        - "*fastp_loose_*.json"

  - fastp:
      name: "PREPROCESS: fastp (tight trimming)"
      anchor: "fastp_tight"   
      info: " results for reads after adapter and quality trimming."
      path_filters:
        - "*fastp_tight_*.json"

  - fastqc:
      name: "PREPROCESS: FastQC (tight trimming)"
      anchor: "fastqc_trimmed"
      info: "FastQC results for the raw reads before adapter trimming."
      path_filters:
        - "*_clean_1_fastqc.zip"
        - "*_clean_2_fastqc.zip"

  - seqkit:
      name: "PREPROCESS: seqkit (tight trimming)"
      anchor: "seqkit_tight"
      info: "SeqKit results after tight trimming."
      path_filters:
        - "*/seqkit_after_cleanup/*stats.tsv"

  - custom_content:
      name: "PREPROCESS: Host contamination"
      info: "Results of host depletion workflow."

  - kraken:
      name: "PREPROCESS: Kraken 2 (tight trimming)"
      info: "Kraken 2 classification results for reads after adapter trimming with fastp."
     
  - samtools:
      name: "VARIANTS: SAMTools (raw)"
      info: "SAMTools counts/statistics after mapping."
      path_filters:
        - "samtools*"

  - snpeff:
      name: "VARIANTS: snpEff (tight trimming)"
      info: "SNPs annotated vis snpEff."
      path_filters:
        - "*snpeff_summary.csv"

  - picard:
      name: "BAM QC: picard"
      info: "WGS QC from picard."
      
  - mosdepth:
      name: "BAM QC: mosdepth"
      info: "This section of the report shows genome-wide coverage metrics generated by mosdepth."
      path_filters:
        - "*mosdepth.summary.txt"
        - "*mosdepth.global.dist.txt"

custom_data:
  host_contamination:
    file_format: tsv
    section_name: "PREPROCESS: Host contamination"
    description: "Results of host depletion workflow."
    plot_type: table
    pconfig:
      id: host_fraction
      title: Host Fraction

  plasflow:
    id: plasflow
    section_name: "PREPROCESS: PlasFlow (plasmid contig fraction)"
    description: "Fraction of assembled contigs ≥1 kb classified as plasmid"
    plot_type: "table"
    file_format: "tsv"

sp:
  host_contamination:
    fn: "*.host_contamination.tsv"
  plasflow:
    fn: "*_plasflow_summary.tsv"

table_columns_visible:
  host_contamination:
    qc_flag: true

table_conditional_formatting:
  host_contamination:
    qc_flag:
      PASS:
        background: "#c7e9c0"
      WARN:
        background: "#fff7bc"
      FAIL:
        background: "#fcbba1"

kraken:
  top_n: 10
